name: Deploy Flutter Web to GitHub Pages

# Root-cause fix: this repo previously had NO automated deployment. The
# live GitHub Pages site was built and pushed manually at some point in
# the past, so it can silently drift out of sync with:
#   - the current source code (route paths, bug fixes, etc.)
#   - the current live backend URL (Render free-tier URLs can change)
# This workflow makes the deployed site a pure, reproducible function of
# this repo's main branch + the secrets below, so that never happens again.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # --base-href MUST match the repo name for GitHub Pages project
      # sites (https://<user>.github.io/<repo>/), or every asset request
      # 404s even though the API calls are fine.
      #
      # API_BASE_URL/WS_BASE_URL MUST point at the CURRENT live Render
      # URL. If that URL ever changes (e.g. the Render service is
      # recreated and its *.onrender.com subdomain changes), update the
      # two repository secrets below — nothing else needs to change.
      - run: |
          flutter build web --release \
            --base-href "/careermate_flutter/" \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
